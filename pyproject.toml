# Tool configuration for the Python parts of the repository.
# Dependencies are listed in requirements-dev.txt; packages get their own
# pyproject.toml under sim/, ident/, ... when they are created.

[tool.pytest.ini_options]
testpaths = ["tests", "sim/tests", "artifacts/tests", "opcua/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncua", "asyncua.*"]
implicit_reexport = true
