# Tool configuration for the Python parts of the repository.
# Dependencies are listed in requirements-dev.txt; packages get their own
# pyproject.toml under sim/, ident/, ... when they are created.

[tool.pytest.ini_options]
testpaths = ["tests", "sim/tests", "artifacts/tests", "opcua/tests", "api/tests", "connectors/tests", "loops/tests", "fuzzy/tests", "supervisor/tests", "anomaly/tests", "softsensor/tests", "core/tests", "experiments"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Frozen by sha256 in the exp16 protocol: do not edit these files to satisfy the linter.
"experiments/exp16_stiction_generalise/g3_chain.py" = ["B905"]
"experiments/exp16_stiction_generalise/final16.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncua", "asyncua.*"]
implicit_reexport = true
