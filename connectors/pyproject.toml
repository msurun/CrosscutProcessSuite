[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscut-connectors"
version = "0.0.1"
description = "Read-only data connectors (CSV export import) for the Crosscut Process Suite"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["crosscut-sim", "pyarrow>=15", "numpy>=1.26", "tzdata"]

[tool.setuptools.packages.find]
where = ["src"]
