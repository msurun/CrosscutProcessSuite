name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest

  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Configure
        run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: C++ unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python/C++ parity test (Linux)
        if: runner.os == 'Linux'
        env:
          CROSSCUT_CORE_MODULE_DIR: ${{ github.workspace }}/build
        run: python -m pytest core/tests -rs
      - name: Python/C++ parity test (Windows)
        if: runner.os == 'Windows'
        env:
          CROSSCUT_CORE_MODULE_DIR: ${{ github.workspace }}/build/Release
        run: python -m pytest core/tests -rs
      - name: Sanitizer build and tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S core -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCROSSCUT_SANITIZE=ON -DCROSSCUT_BUILD_PYTHON=OFF
          cmake --build build-asan
          ctest --test-dir build-asan --output-on-failure

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        working-directory: .
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite
        run: npm run e2e:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-gateway:
    name: Browser e2e (auth + gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        working-directory: .
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Auth spec
        env:
          E2E_AUTH: "1"
        run: node e2e/support/run_e2e.mjs e2e/auth.spec.ts
      - name: Live gateway specs
        env:
          E2E_GATEWAY: "1"
        run: node e2e/support/run_e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-gateway-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
