[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscut-sim"
version = "0.0.1"
description = "Plant simulators with known ground truth for the Crosscut Process Suite"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=1.26", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]
