[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscut-api"
version = "0.0.1"
description = "Read-only HTTP API over Crosscut datasets (backend of the trend viewer)"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["fastapi>=0.110", "crosscut-sim", "crosscut-supervisor", "pyarrow>=15", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
