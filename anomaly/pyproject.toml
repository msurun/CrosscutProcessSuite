[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscut-anomaly"
version = "0.0.1"
description = "PCA anomaly detection (Hotelling T2 and SPE) for the Crosscut Process Suite, advisory only"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crosscut_anomaly = ["py.typed"]
