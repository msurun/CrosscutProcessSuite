[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscut-mpc"
version = "0.0.1"
description = "Deterministic Python reference for linear two-layer MPC"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["numpy>=1.26", "scipy>=1.11", "osqp>=1.0", "crosscut-loops", "crosscut-artifacts"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crosscut_mpc = ["py.typed"]
