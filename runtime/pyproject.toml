[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscut-runtime"
version = "0.0.1"
description = "On-prem runtime service: runs deployed jobs (live loop KPI) against live data sources"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["crosscut-connectors", "crosscut-loops", "crosscut-fuzzy", "crosscut-supervisor", "jsonschema>=4", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crosscut_runtime = ["py.typed"]

[project.optional-dependencies]
# The controller job proposes writes through the gateway's file mailbox client in crosscut-api.
gateway = ["crosscut-api"]
