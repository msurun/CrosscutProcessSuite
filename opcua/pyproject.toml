[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscut-opcua"
version = "0.0.1"
description = "OPC UA test server and data collector for the Crosscut Process Suite simulators"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["asyncua>=1.1", "crosscut-sim", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]
